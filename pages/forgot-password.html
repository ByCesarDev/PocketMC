<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketMC Accounts — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link rel="stylesheet" href="../assets/css/landing.css">
  <script src="../assets/js/index.js" defer></script>
  <script src="../assets/js/config.js"></script>
  <script type="module" src="../assets/js/i18n.js"></script>
</head>
<body class="landing-body">

  <!-- NAVBAR -->
  <header class="landing-navbar">
    <a href="../index.html" class="pmc-logo">
      <div class="pmc-logo-icon">P</div>
      <span>PocketMC</span>
      <span class="pmc-logo-badge" style="margin-left: 0.2rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; font-size: 0.65rem;">ACCOUNTS</span>
    </a>
    <nav class="pmc-nav-links">
      
<div class="pmc-lang-dropdown">
  <button class="pmc-lang-trigger" id="btn-lang-trigger" aria-haspopup="true" data-vela-ripple>
    <span id="current-lang-label">🇪🇸 Español</span>
    <span class="pmc-chevron">▾</span>
  </button>
  <div class="pmc-dropdown-menu" id="lang-dropdown-menu">
    <button class="pmc-dropdown-item" data-lang-option="es">
      <span>🇪🇸 Español</span>
      <span class="pmc-check">✓</span>
    </button>
    <button class="pmc-dropdown-item" data-lang-option="en">
      <span>🇺🇸 English</span>
      <span class="pmc-check">✓</span>
    </button>
  </div>
</div>

      <a href="login.html" class="pmc-btn pmc-btn-ghost pmc-btn-sm" data-i18n="nav.signIn" data-vela-ripple>Iniciar sesión</a>
    </nav>
  </header>

  <!-- FORGOT PASSWORD CARD -->
  <main class="pmc-wrapper">
    <div class="pmc-card">

      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #10b981 0%, #059669 100%); border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; color: #022315; font-size: 1.6rem; font-weight: 900; margin-bottom: 1rem; box-shadow: 0 0 25px rgba(16, 185, 129, 0.4);">
          🔑
        </div>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: #ffffff; letter-spacing: -0.02em; margin: 0;" data-i18n="forgot.title">Recuperar Clave</h1>
        <p style="font-size: 0.9rem; color: var(--pmc-text-secondary); margin-top: 0.35rem;" data-i18n="forgot.subtitle">Ingresa tu correo para recibir las instrucciones</p>
      </div>

      <div id="error-box" class="pmc-alert pmc-alert-danger" style="display: none;"></div>
      <div id="success-box" class="pmc-alert pmc-alert-success" style="display: none;"></div>

      <form id="reset-form" novalidate>
        <div class="pmc-field" style="margin-bottom: 1.5rem;">
          <label class="pmc-label" for="email" data-i18n="forgot.email">Correo electrónico</label>
          <input class="pmc-input" type="email" id="email" data-i18n-placeholder="forgot.emailPlaceholder" placeholder="tu@correo.com" required autocomplete="email">
        </div>

        <button type="submit" id="btn-reset" class="pmc-btn pmc-btn-primary pmc-btn-full" style="padding: 0.8rem;" data-vela-ripple>
          <span data-i18n="forgot.btn">Enviar enlace de recuperación</span>
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem;">
        <a href="login.html" style="font-size: 0.875rem; color: var(--pmc-text-secondary);" data-i18n="forgot.backLogin">← Volver a Iniciar sesión</a>
      </div>

    </div>
  </main>

  <!-- ═══ FOOTER ════════════════════════════════════════════ -->
  <footer class="landing-footer">
    <div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.5rem; align-items: center;">
      <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: #ffffff;">
        <div class="pmc-logo-icon" style="width: 22px; height: 22px; font-size: 0.8rem;">P</div>
        <span>PocketMC Accounts</span>
      </div>
      <p style="font-size: 0.85rem; margin: 0; color: #94a3b8;"><span data-i18n="footer.builtWith">Powered by</span> <a href="https://github.com/ByCesarDev/vela" target="_blank" style="color: #34d399; font-weight: 600;">♡ Vela Framework</a></p>
      <p style="font-size: 0.75rem; margin-top: 0.25rem; opacity: 0.6; color: #64748b;" data-i18n="footer.disclaimer">PocketMC is an open-source project. Not affiliated with Mojang or Microsoft.</p>
    </div>
  </footer>


  <script type="module">
    import { requestPasswordReset } from '../assets/js/auth.js';
    import { t } from '../assets/js/i18n.js';

    const form = document.getElementById('reset-form');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');
    const btnReset = document.getElementById('btn-reset');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      if (!email) return;

      btnReset.disabled = true;
      btnReset.innerHTML = '<span>' + t('forgot.sending') + '</span>';

      try {
        await requestPasswordReset(email);
        successBox.textContent = t('forgot.success');
        successBox.style.display = 'block';
        Vela.toast({
          title: t('forgot.toastTitle'),
          message: t('forgot.toastMsg'),
          type: 'info'
        });
      } catch (err) {
        errorBox.textContent = err.message || 'No se pudo enviar el enlace de recuperación.';
        errorBox.style.display = 'block';
        btnReset.disabled = false;
        btnReset.innerHTML = '<span>' + t('forgot.btn') + '</span>';
      }
    });
  </script>
</body>
</html>
