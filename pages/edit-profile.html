<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketMC Accounts — Edit Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <link rel="stylesheet" href="../assets/css/landing.css">
  <script src="../assets/js/index.js" defer></script>
  <script src="../assets/js/config.js"></script>
  <script type="module" src="../assets/js/i18n.js"></script>
</head>
<body class="landing-body">

  <!-- NAVBAR -->
  <header class="landing-navbar">
    <a href="../index.html" class="pmc-logo">
      <div class="pmc-logo-icon">P</div>
      <span>PocketMC</span>
      <span class="pmc-logo-badge" style="margin-left: 0.2rem; background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #34d399; font-size: 0.65rem;">ACCOUNTS</span>
    </a>
    <nav class="pmc-nav-links">
      
<div class="pmc-lang-dropdown">
  <button class="pmc-lang-trigger" id="btn-lang-trigger" aria-haspopup="true" data-vela-ripple>
    <span id="current-lang-label">🇪🇸 Español</span>
    <span class="pmc-chevron">▾</span>
  </button>
  <div class="pmc-dropdown-menu" id="lang-dropdown-menu">
    <button class="pmc-dropdown-item" data-lang-option="es">
      <span>🇪🇸 Español</span>
      <span class="pmc-check">✓</span>
    </button>
    <button class="pmc-dropdown-item" data-lang-option="en">
      <span>🇺🇸 English</span>
      <span class="pmc-check">✓</span>
    </button>
  </div>
</div>

      <a href="profile.html" class="pmc-btn pmc-btn-ghost pmc-btn-sm" data-i18n="nav.backProfile" data-vela-ripple>← Volver al Perfil</a>
    </nav>
  </header>

  <!-- EDIT CARD -->
  <main class="pmc-wrapper">
    <div class="pmc-card">

      <div style="margin-bottom: 1.75rem;">
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #ffffff; margin: 0 0 0.35rem 0;" data-i18n="edit.title">Editar Perfil</h1>
        <p style="font-size: 0.9rem; color: var(--pmc-text-secondary); margin: 0;" data-i18n="edit.subtitle">Modifica los datos visibles de tu jugador</p>
      </div>

      <div id="error-box" class="pmc-alert pmc-alert-danger" style="display: none;"></div>
      <div id="success-box" class="pmc-alert pmc-alert-success" style="display: none;"></div>

      <form id="edit-form" novalidate>
        <div class="pmc-field">
          <label class="pmc-label" for="username" data-i18n="edit.username">Nombre de usuario (@handle)</label>
          <input class="pmc-input" type="text" id="username" required>
        </div>

        <div class="pmc-field" style="margin-bottom: 1.75rem;">
          <label class="pmc-label" for="displayName" data-i18n="edit.displayName">Nombre para mostrar</label>
          <input class="pmc-input" type="text" id="displayName" data-i18n-placeholder="edit.displayNamePlaceholder" placeholder="Nombre en el juego">
        </div>

        <div style="display: flex; gap: 0.75rem;">
          <a href="profile.html" class="pmc-btn pmc-btn-ghost" style="flex: 1;" data-i18n="edit.cancel" data-vela-ripple>Cancelar</a>
          <button type="submit" id="btn-save" class="pmc-btn pmc-btn-primary" style="flex: 1;" data-vela-ripple>
            <span data-i18n="edit.save">Guardar cambios</span>
          </button>
        </div>
      </form>

    </div>
  </main>

  <!-- ═══ FOOTER ════════════════════════════════════════════ -->
  <footer class="landing-footer">
    <div style="max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 0.5rem; align-items: center;">
      <div style="display: flex; align-items: center; gap: 0.5rem; font-weight: 700; color: #ffffff;">
        <div class="pmc-logo-icon" style="width: 22px; height: 22px; font-size: 0.8rem;">P</div>
        <span>PocketMC Accounts</span>
      </div>
      <p style="font-size: 0.85rem; margin: 0; color: #94a3b8;"><span data-i18n="footer.builtWith">Powered by</span> <a href="https://github.com/ByCesarDev/vela" target="_blank" style="color: #34d399; font-weight: 600;">♡ Vela Framework</a></p>
      <p style="font-size: 0.75rem; margin-top: 0.25rem; opacity: 0.6; color: #64748b;" data-i18n="footer.disclaimer">PocketMC is an open-source project. Not affiliated with Mojang or Microsoft.</p>
    </div>
  </footer>


  <script type="module">
    import { getCurrentSession, getProfile, updateProfileDetails } from '../assets/js/auth.js';
    import { t } from '../assets/js/i18n.js';

    let currentUser = null;

    async function init() {
      const session = await getCurrentSession();
      if (!session?.user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = session.user;
      const profile = await getProfile(currentUser.id);
      if (profile) {
        document.getElementById('username').value = profile.username || '';
        document.getElementById('displayName').value = profile.display_name || '';
      }
    }

    init();

    const form = document.getElementById('edit-form');
    const errorBox = document.getElementById('error-box');
    const successBox = document.getElementById('success-box');
    const btnSave = document.getElementById('btn-save');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const displayName = document.getElementById('displayName').value.trim();

      if (!username || username.length < 3 || username.length > 16) {
        errorBox.textContent = t('reg.errUserLength');
        errorBox.style.display = 'block';
        return;
      }

      btnSave.disabled = true;
      btnSave.innerHTML = '<span>' + t('edit.saving') + '</span>';

      try {
        await updateProfileDetails({ username, displayName });
        successBox.textContent = t('edit.success');
        successBox.style.display = 'block';
        Vela.toast({
          title: t('edit.toastTitle'),
          message: t('edit.toastMsg'),
          type: 'success'
        });
        setTimeout(() => {
          window.location.href = 'profile.html';
        }, 500);
      } catch (err) {
        errorBox.textContent = err.message || 'Error al actualizar el perfil.';
        errorBox.style.display = 'block';
        btnSave.disabled = false;
        btnSave.innerHTML = '<span>' + t('edit.save') + '</span>';
      }
    });
  </script>
</body>
</html>
